<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Видеотека">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Стоматологическая видеотека</title>
<style>
:root{--bg:#0f1417;--panel:#151c20;--panel2:#1b2429;--line:#26323a;--text:#e6eef2;--muted:#8fa3ad;--acc:#2bb3a3;--acc2:#1f8a7e;--warn:#e2a03f;--bad:#e0605a;--good:#4fbf6f;--l1:#4fbf6f;--l2:#e2a03f;--l3:#e0605a;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc)}
.app{display:grid;grid-template-columns:290px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 10px;font-weight:700;font-size:16px;display:flex;gap:10px;align-items:center}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.search{margin:0 14px 10px}
.search input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);outline:none}
.search input:focus{border-color:var(--acc)}
nav{overflow:auto;padding:4px 8px 16px;flex:1}
.nav-h{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 6px;display:flex;justify-content:space-between;cursor:pointer;user-select:none}
.nav-i{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;cursor:pointer;user-select:none}
.nav-i:hover{background:var(--panel2)}
.nav-i.on{background:#1d3a37;color:#bff3ea}
.nav-i .ic{width:22px;text-align:center}
.nav-i .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-i .cnt{color:var(--muted);font-size:12px}
.mini{height:3px;background:var(--line);border-radius:2px;margin:-2px 10px 3px 42px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--acc)}
main{overflow:auto;min-width:0}
.wrap{max-width:1150px;margin:0 auto;padding:26px 30px 60px}
h1{font-size:24px;margin:0 0 4px}
h3{margin:26px 0 10px}
.sub{color:var(--muted);margin-bottom:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.pri:hover{background:var(--acc)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.lv1{color:var(--l1);border-color:#2f5f3c}.lv2{color:var(--l2);border-color:#6a5124}.lv3{color:var(--l3);border-color:#6a2f2c}
.tabs{display:flex;gap:6px;margin:14px 0 6px;flex-wrap:wrap;align-items:center}
.tab{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.tab.on{background:var(--panel2);color:var(--text);border-color:var(--acc)}
.lvl-h{display:flex;align-items:center;gap:10px;margin:22px 0 8px;font-weight:600}
.lvl-h .bar{flex:1;height:1px;background:var(--line)}
.ser{color:var(--muted);font-size:12px;margin:12px 0 4px 4px}
.vid{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid transparent;margin-bottom:6px;cursor:pointer}
.vid:hover{border-color:var(--line);background:var(--panel2)}
.vid .play{width:34px;height:34px;border-radius:50%;background:#1d3a37;display:grid;place-items:center;color:#bff3ea}
.vid.done .play{background:#24432d;color:#a8f0b9}
.vid .t{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.vid .m{color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.pbar{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden;max-width:420px}
.pbar i{display:block;height:100%;background:var(--acc)}
.icb{background:none;border:none;font-size:17px;color:#5b6b73;padding:4px 5px}
.icb:hover{color:var(--text)}
.icb.on{color:#f3c34b}
.icb.later.on{color:#7fc8ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 6px;font-size:15px}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--acc)}
.stat{font-size:26px;font-weight:700}
.muted{color:var(--muted)}
.empty{color:var(--muted);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.stats{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.6fr;gap:12px;margin-bottom:8px}
.bars{display:flex;align-items:flex-end;gap:4px;height:56px;margin-top:8px}
.bars i{flex:1;background:var(--acc2);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars i.today{background:var(--acc)}
.bars i.goal{outline:1px solid #4fbf6f}
.doc{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--panel);margin-bottom:6px}
.doc .fi{width:40px;height:48px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:#5a6b74}
.fi.pdf{background:#b8433d}.fi.djvu{background:#7b5ab8}.fi.doc,.fi.docx{background:#2f6db5}.fi.ppt,.fi.pptx{background:#c2662d}.fi.zip{background:#69707a}.fi.jpg,.fi.jpeg,.fi.png{background:#2f8a5a}
.doc .t{font-weight:500}
.doc .m{color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;align-items:center}
select.st{width:auto;padding:4px 6px;font-size:12px}
/* player */
.player{position:fixed;inset:0;background:#05080a;display:none;z-index:50}
.player.on{display:grid;grid-template-columns:1fr 380px;grid-template-rows:100vh}
.pl-main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh}
.pl-top{display:flex;align-items:center;gap:10px;padding:12px 16px}
.pl-top .ttl{flex:1;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbox{flex:1;min-height:0;position:relative;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.vmsg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;color:var(--muted);background:rgba(0,0,0,.6)}
.vmsg.on{display:grid}
.vmsg .box{max-width:540px}
.pl-ctrl{display:flex;gap:6px;align-items:center;padding:10px 16px;flex-wrap:wrap;border-top:1px solid var(--line)}
.spd{padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2)}
.spd.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.pl-side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;height:100vh}
.pl-side .sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.ptabs{display:flex;border-bottom:1px solid var(--line)}
.ptab{flex:1;padding:10px 6px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted)}
.ptab.on{color:var(--text);border-bottom-color:var(--acc)}
.pane{overflow:auto;flex:1;padding:12px 16px;display:none}
.pane.on{display:block}
textarea,input[type=text],input[type=number],select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font:inherit;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:54px}
#noteTa{min-height:260px;font-size:13px;line-height:1.5}
label.small{font-size:12px;color:var(--muted);display:block;margin:8px 0 4px}
.mcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.mcard .q{font-weight:600}
.mcard .a{color:var(--muted);margin-top:4px;white-space:pre-wrap}
.ts{font-size:11px;padding:1px 7px;border-radius:999px;background:#1d3a37;color:#bff3ea;border:none}
.att{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;background:var(--panel2);margin-bottom:6px;cursor:pointer;border:1px solid transparent}
.att:hover{border-color:var(--acc)}
.att .fi{width:30px;height:36px;border-radius:5px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;flex:none}
.fi{background:#5a6b74}
/* flashcards */
.flip{perspective:1200px;max-width:640px;margin:20px auto}
.fc{position:relative;height:300px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fc.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px;text-align:center;font-size:19px;white-space:pre-wrap;overflow:auto}
.face.back{transform:rotateY(180deg);background:#13241f;font-size:17px}
.face .hint{position:absolute;bottom:12px;font-size:12px;color:var(--muted)}
.rate{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.rate .btn{min-width:110px}
.rate small{display:block;font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
.scan{max-width:560px;margin:12vh auto;text-align:center}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:16px 0}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d3a37;color:#dffaf5;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .25s;z-index:99;pointer-events:none;max-width:80vw}
.toast.on{opacity:1}
.dl{position:fixed;right:20px;bottom:20px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:320px;z-index:98;display:none}
.dl.on{display:block}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:11px}
/* аккаунт */
.userchip{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--acc2);display:grid;place-items:center;font-weight:700;flex:none}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.auth{position:fixed;inset:0;background:var(--bg);z-index:80;display:none;overflow:auto}
.auth.on{display:block}
.authbox{max-width:400px;margin:8vh auto;padding:0 20px 40px}
.auerr{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.ordiv{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0}
.ordiv:before,.ordiv:after{content:"";flex:1;height:1px;background:var(--line)}
input[type=password]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font:inherit;outline:none}
/* читалка */
.reader{position:fixed;inset:0;background:#2b3236;z-index:60;display:none;flex-direction:column}
.reader.on{display:flex}
.rd-top{display:flex;gap:12px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.rd-title{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-tools{display:flex;gap:6px;align-items:center;padding:6px 14px;background:var(--panel2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tool{padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:13px}
.tool.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid transparent;padding:0;flex:none}
.dot.on{border-color:#fff;box-shadow:0 0 0 1px #000}
.rd-body{flex:1;display:flex;min-height:0}
.rd-scroll{flex:1;overflow:auto;padding:20px 0 60px;position:relative}
.rd-side{width:300px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px}
.reader.noside .rd-side{display:none}
#rdPages{display:flex;flex-direction:column;align-items:center;gap:14px}
.pg{position:relative;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.4);flex:none}
.pg canvas.pgc{position:absolute;inset:0}
.pg .hl-layer{position:absolute;inset:0;mix-blend-mode:multiply;pointer-events:none}
.pg .hl{position:absolute;opacity:.55;border-radius:2px}
.pg canvas.ink{position:absolute;inset:0;pointer-events:none}
.pg .nt-layer{position:absolute;inset:0;pointer-events:none}
.pg .nt{position:absolute;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:14px;cursor:pointer;pointer-events:auto;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pg .nt.sm{width:18px;height:18px;font-size:10px}
.pg .tx{position:absolute;pointer-events:auto;cursor:pointer;font-weight:600;white-space:pre-wrap;line-height:1.15;max-width:60%;font-family:"Segoe Print","Comic Sans MS",cursive}
.pg .pgn{position:absolute;right:-34px;bottom:0;color:#9aa;font-size:11px}
.textLayer{position:absolute;text-align:initial;inset:0;overflow:hidden;line-height:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer ::selection{background:rgba(0,90,255,.3)}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.pg .nt-layer{z-index:3}
.reader[data-tool=pen] .textLayer,.reader[data-tool=marker] .textLayer,.reader[data-tool=note] .textLayer,.reader[data-tool=text] .textLayer,.reader[data-tool=eraser] .textLayer{pointer-events:none;user-select:none}
.reader[data-tool=pen] .pg,.reader[data-tool=marker] .pg{cursor:crosshair;touch-action:none}
.reader[data-tool=note] .pg,.reader[data-tool=text] .pg{cursor:copy}
.reader[data-tool=eraser] .pg{cursor:not-allowed}
.rdpop{position:fixed;z-index:70;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.5);display:none}
.rdpop.on{display:block}
.ra{display:flex;gap:8px;padding:8px;border-radius:8px;cursor:pointer;margin-bottom:4px}
.ra:hover{background:var(--panel2)}
.ra .sw{width:6px;border-radius:3px;flex:none}
.ra .rt{font-size:13px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.mtop{display:none}
.scrim{display:none}
.install{background:linear-gradient(135deg,#1d3a37,#16262b);border:1px solid var(--acc2);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
@media (max-width:900px){
  html,body{font-size:15px}
  .mtop{display:flex;position:fixed;top:0;left:0;right:0;z-index:40;height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;align-items:center;gap:8px;background:var(--panel);border-bottom:1px solid var(--line)}
  .mtop b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app{grid-template-columns:1fr;height:auto;min-height:100vh;padding-top:52px}
  main{overflow:visible}
  aside{position:fixed;top:0;bottom:0;left:0;width:86%;max-width:340px;z-index:45;transform:translateX(-105%);transition:transform .25s;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .app.navopen aside{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:44}
  .wrap{padding:16px 14px 80px}
  h1{font-size:21px}
  .stats{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .card{padding:12px}
  .vid{grid-template-columns:30px 1fr auto;gap:8px;padding:9px}
  .vid .play{width:30px;height:30px}
  .doc{grid-template-columns:34px 1fr;gap:10px}
  .doc>.row{grid-column:1/-1;justify-content:flex-end}
  .tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
  .tab{white-space:nowrap}
  .player.on{display:flex;flex-direction:column;overflow:auto;padding-top:env(safe-area-inset-top)}
  .pl-main{height:auto;flex:none}
  .pl-top{position:sticky;top:0;z-index:2;background:#05080a}
  .vbox{flex:none;aspect-ratio:16/9;width:100%}
  .pl-ctrl{gap:5px;padding:8px 10px}
  .pl-side{display:flex;flex:none;height:auto;min-height:70vh;border-left:none;border-top:1px solid var(--line)}
  .pane{overflow:visible}
  .reader{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .rd-top{gap:8px;padding:6px 8px}
  .rd-tools{flex-wrap:nowrap;overflow-x:auto;padding:6px 8px}
  .tool{white-space:nowrap}
  .rd-scroll{padding:10px 0 40px}
  .pg .pgn{display:none}
  .rd-side{position:fixed;right:0;top:0;bottom:0;width:86%;max-width:360px;z-index:66;box-shadow:-8px 0 30px rgba(0,0,0,.5);padding-top:calc(14px + env(safe-area-inset-top))}
  .flip{margin:12px 0}.fc{height:260px}.face{font-size:17px;padding:18px}
  .rate .btn{min-width:0;flex:1}
  .authbox{margin:4vh auto}
  table,tbody,tr,td{display:block;width:100%!important}
  th{display:none}
}
</style>
</head>
<body>
<div class="mtop" id="mtop"><button class="icb" id="mnav" style="font-size:22px;color:var(--text)">☰</button><b id="mtitle">Стоматологическая видеотека</b><span style="flex:1"></span><button class="icb" id="msearch" style="color:var(--text)">🔍</button></div>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside>
    <div class="brand"><span style="font-size:24px">🦷</span><div>Стоматологическая видеотека<small>хирургия · библиотека · карточки</small></div></div>
    <div class="search"><input id="q" type="text" placeholder="Поиск по видео и книгам…  ( / )"></div>
    <nav id="nav"></nav>
    <div class="userchip" id="userChip"></div>
  </aside>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>

<div class="player" id="player">
  <div class="pl-main">
    <div class="pl-top">
      <button class="btn" id="plClose">← Назад</button>
      <div class="ttl" id="plTitle"></div>
      <button class="icb later" id="plLater" title="Смотреть позже">⏱</button>
      <button class="icb" id="plStar" title="В избранное">★</button>
    </div>
    <div class="vbox">
      <video id="video" controls playsinline preload="metadata"></video>
      <div class="vmsg" id="vmsg"><div class="box" id="vmsgBox"></div></div>
    </div>
    <div class="pl-ctrl">
      <span class="muted" style="margin-right:4px">Скорость:</span>
      <span id="spdBtns" class="row" style="gap:6px"></span>
      <span style="flex:1"></span>
      <button class="btn sm" id="back10">⟲ 10 с</button>
      <button class="btn sm" id="fwd10">10 с ⟳</button>
      <button class="btn sm" id="pipBtn" title="Картинка в картинке">⧉</button>
      <button class="btn sm" id="nextBtn">Следующее ▶</button>
      <button class="btn sm" id="markDone">✓ Просмотрено</button>
    </div>
  </div>
  <div class="pl-side">
    <div class="sec">
      <div class="row" style="flex-wrap:nowrap">
        <select id="plSec"></select>
        <select id="plLvl" style="width:130px"><option value="1">Начальный</option><option value="2">Средний</option><option value="3">Продвинутый</option></select>
      </div>
    </div>
    <div class="ptabs">
      <button class="ptab" data-p="att">📎 Материалы <span id="attN"></span></button>

const SECTIONS = [

  {id:'bone',     name:'Костная пластика и регенерация',  icon:'🦴', desc:'НКР/GBR, блоки, вертикальная аугментация, мембраны, PRF', def:2},
  {id:'softimpl', name:'Мягкие ткани вокруг имплантатов', icon:'🩹', desc:'Кератинизированная десна, ССТ, вестибулопластика', def:2},
  {id:'perio',    name:'Пародонтальная хирургия',         icon:'🌿', desc:'Рецессии, лоскуты, туннель, VISTA, удлинение коронки, регенерация', def:2},
  {id:'fullarch', name:'Полная адентия / All-on-X',       icon:'🦾', desc:'All-on-4/6, наклонные имплантаты, тотальная реабилитация', def:3},
  {id:'complic',  name:'Осложнения и периимплантит',      icon:'⚠️', desc:'Ошибки, осложнения имплантации, периимплантит', def:3},
  {id:'apical',   name:'Апикальная хирургия',             icon:'🎯', desc:'Резекция верхушки, ретроградное пломбирование', def:2},
  {id:'mixed',    name:'Курсы и конгрессы (смешанные)',   icon:'🎓', desc:'Многотемные курсы и конгрессы', def:2},
  {id:'patients', name:'Видео для пациентов',             icon:'👥', desc:'Объяснения для пациентов (Geistlich)', def:1},
];
const OTHER = {id:'other', name:'Не хирургия (скрыто)', icon:'📦', desc:'Терапия, ортодонтия, ортопедия и прочее — на случай, если правила ошиблись', def:2};

const R = (s) => new RegExp(s, 'i');
const ROOTS = /^(хирургия,импланатация,пародонтология|вебинары|вебинары по стоматологии|часть \d|часть \d \(.*\))$/;
const EXCL_FOLDERS = R('/(детская стоматология|ортодонтия|ортопедия|первичная консультация|реставрация|сопр|dental foto|гнатология|алексей сошников|ронкин блум|carlos falcao|ricardo|paroortho|sadao sato[^/]*|часть 3|эндодонтия)/');
const EXCL_TEXT = R('винир|скейлинг|гигиен|шинирован|дизайн.{0,10}улыбк|посмішк|естетиці|отбел|ортодонт|окклюзионные концепции|фотограф|обработка фото|bandicam|нехирургическ(ое|их) (лечен|методик)|первичная терапия|herpes|личный бренд|композит|keynote|ротовая полость и ее окружение');
const PART4 = R('/часть 4/');
const PART4_ALLOW = R('апикальн|анестез|неотлож|клкт');
const OVERRIDES = [['первые подходы в имплантации','implant']];

// "сильные" правила — узкая тема (порядок важен)
const STRONG = [
  ['patients', R('geistlich')],
  ['apical',   R('апикальн|ретроградн|эндодонтическ(ая|ой) (микро)?хирург')],
  ['basics',   R('накрытие стола|инфекционн\\S* контрол|асептик|протектор s|анафилакт|неотлож')],
  ['fullarch', R('all.?on|all.?in.?4|all in|полн\\S*\\s*адент|тотальн|наклонн|ангулирован|malo|все на 4|скулов|беззуб|конометрическ|degidi|mintrone|agliardi|fabbri|атрофическ')],
  ['sinus',    R('синус|sinus|верхнечелюстн|пазух|(^|[^а-яё])лор([^а-яё]|$)|jadach|ядах')],
  ['immediate',R('одномоментн|немедленн|непосредственн|idr|в лунку|имлантиц')],
  ['socket',   R('лунк|лунок|socket|shield|корневого щита|частичн\\S* экстракц|\\bpet\\b|\\btet\\b|dtr|экструзия зубов и методы|презервац|консерваці')],
  ['extract',  R('удален|удалени|экстракционн\\S* хир|третьих моляр|восьмых|ретинир|дистопир|аутотрансплант|хирургическая экструзия')],
  ['bone',     R('костн\\S* пластик|аугментац|нкр')],
  ['complic',  R('осложнен|периимплантит|пери-имплантит|мукозит|ошибк|отторжен|перфорац')],
  ['digital',  R('цифров|навигац|шаблон')],
  ['softimpl', null], // особый случай: мягкие ткани + имплант в пути
  ['perio',    R('рецесс|пародонт|внутрикост|фуркац|межкорнев|gtr|vista|туннел|тоннельн(?!ая методика)|сосоч|удлинен|мукогинг|mucogingival|кортикотом|тромбелли|резекц|трансплантат|соединительнотк|rasperini|carnevale|sculean|zucchelli|зуккелли|зукелли|suzuki|сузуки|лоскут')],
  ['bone',     R('гкр|gbr|костн|кост[иь]|блок|sausage|расщепл|титанов|мембран|prf|фибрин|тромбоцит|регенерац|наращиван')],
];
const SOFT_KW = R('мягк|десн|кератин|слизист|сст|соединительнотк|пластическ|вестибулопл|лоскут|трансплантат');
// "слабые" правила — общие слова
const WEAK = [
  ['perio',   R('мягк|десн|пластическ|слизист')],
  ['implant', R('имплант|раскрыти|протезирован|nobel|нобель|остеоинтегр')],
  ['basics',  R('анатоми|клкт|(^|[^а-яё])кт([^а-яё]|$)|рентген|диагност|анестез|анестетик|антибиот|беремен|шв(ов|ы)|наложени|эргономик|хирургическ|планирован')],
];
const MIXED_FOLDERS = R('конгресс|5d подход|evolution|somoza|carvalho|palacci|есипович|продвинут');

function ruleHit(rules, text, ctx) {
  for (const [id, re] of rules) {
    if (id === 'softimpl') {
      if (SOFT_KW.test(text) && /имплант/i.test(ctx)) return id;
      continue;
    }
    if (re.test(text)) return id;
  }
  return null;
}

const norm = (t) => t.toLowerCase().replace(/[_+]/g, ' ').replace(/[​️]/g, '').replace(/\s+/g, ' ');

function classify(path) {
  const p = norm(path);
  const parts = p.split('/').filter(Boolean);
  const name = parts[parts.length - 1].replace(/(\.(mp4|mov|mkv|wmv|avi|m4v|webm))+$/g, '');
  const folders = parts.slice(0, -1).filter(f => !ROOTS.test(f)).reverse(); // от ближайшей папки к корню, без общих корней
  const ctx = folders.join('/') + '/' + name;

  for (const [k, v] of OVERRIDES) if (name.includes(k)) return v;
  if (/geistlich/.test(p)) return 'patients';
  let sec = null;
  // апикальная хирургия раньше исключений (часть лежит в папках «эндодонтия»)
  if (STRONG[1][1].test(name)) sec = 'apical';
  if (!sec) {
    if (EXCL_FOLDERS.test(p + '/')) return 'other';
    if (EXCL_TEXT.test(ctx) && !/кортикотом/.test(ctx)) return 'other';
    if (PART4.test(p) && !PART4_ALLOW.test(name)) return 'other';
  }
  if (!sec) sec = ruleHit(STRONG, name, ctx);
  if (!sec) for (const f of folders) {
    if (MIXED_FOLDERS.test(f)) { sec = 'mixed'; break; }
    sec = ruleHit(STRONG, f, ctx); if (sec) break;
  }
  if (!sec) sec = ruleHit(WEAK, name, ctx);
  if (!sec) for (const f of folders) { sec = ruleHit(WEAK, f, ctx); if (sec) break; }
  if (!sec) sec = parts[0] === 'хирургия,импланатация,пародонтология' ? 'mixed' : 'other';
  return sec;
}

const L1 = R('основ|начал|базов|фундамент|введени|с чего начать|первый шаг|анатоми|классификац|принцип|путеводител|для пациент|общее|вводн|концепция атравм|модуль №1|что делать после|стандартная имплантация|ключевые факторы');
const L3 = R('вертикальн|блок|sausage|all.?on|all in|скулов|микрохирург|сложн|нестандартн|продвинут|осложнен|ошибк|перфорац|латеральн|4d|тотальн|аутотрансплант|ретинир|дистопир|экструзи|расщепл|титанов|нерезорбир|аутоген|vista|кортикотом|конгресс|периимплантит|забор|ротационн');

const L2 = R('эстетик|эстетическ|раскрыти|протезирован|отсроченн|коротк');

function levelOf(path, sec) {
  const p = path.toLowerCase();
  const a = L1.test(p), b = L3.test(p);
  if (a && b) return 2;
  if (b) return 3;
  if (a) return 1;
  if (L2.test(p)) return 2;
  const s = SECTIONS.find(x => x.id === sec) || OTHER;
  return s.def;
}

const AREAS = [

  ['practice', R('фотограф|фото(?!протокол)|foto|bandicam|бренд|эргономик|наконечник|консультац|стоимость лечения|документы и общение|счастливый пациент|keynote')],

  ['resto',    R('реставрац|композит|винир|адгези|отбел|bleach|раббердам|изоляц|direct posterior|морфолог|falcao|кожемяк|лазарев|радлинск|ахундов|пономаренко|аполлония|щербаков|дентхаки|финишн|крутиков|дизайн|посмішк|естетиці|стираем|токсичн|трещин|постендо|каинов|черных|першин|михайлюк|шиков|сошников|беретар|анализ эстетики|керамическ\\S* виниры')],
  ['prosth',   R('ортопед|препарир|корон|протезир|бюгел|съемн|вкладк|микропротез|оттиск|cad|cerec|керамическ|цифров|колесников|наумов|брагарев|чавуш|компаниец')],
  ['gnath',    R('гнатолог|окклюз|артикул|сустав|мышц|м.язів|жувальн|дыхательн|шины|slavicek|славичек|геокчян|парунов|эрметов|эстетика и функция|функционально|сошлифов|функциональн\\S* окклюз')],
  ['ortho',    R('ортодонт|chris chang|bakr rabie|нестор|беселер|ormco|sato|эластик|мини импланты|расширител|прямой дуги|ронкин')],
  ['periot',   R('гигиен|скейлинг|нехирургическ|шинирован|паропатолог|пародонт|paroortho|під`ясенн|зубних відкладень')],
  ['oralmed',  R('сопр|herpes|инфекц|слизист|системные заболевания|эпители|слюнн|кожные|антибиот|беремен')],
];
function classifyArea(path){
  const p = norm(path); const parts = p.split('/').filter(Boolean);
  const name = parts[parts.length-1].replace(/(\.(mp4|mov|mkv|wmv|avi|m4v|webm))+$/g, '');
  const folders = parts.slice(0,-1).filter(f => !ROOTS.test(f)).reverse();
  for (const [id, re] of AREA_RULES) if (re.test(name)) return id;
  for (const f of folders) for (const [id, re] of AREA_RULES) if (re.test(f)) return id;
  return 'misc';
}

const VIDEO_TREES = /^\/(хирургия,импланатация,пародонтология|вебинары)\//i;

function libCategory(path){
  const p = norm(path), parts = p.split('/').filter(Boolean), name = parts[parts.length-1];
  if (/\.zip$/.test(name)) return 'z_arch';
  if (VIDEO_TREES.test(p)) return 's_course';
  const f = parts.slice(0,-1).join('/');
  if (/^статьи/.test(f)) {
    if (/аол4/.test(f)) return 'a_allon4';
    if (/зигома/.test(f)) return 'a_zyg';
    if (/бисфосфонат/.test(f)) return 'a_mronj';
    return 'a_misc';
  }
  if (/^методички/.test(f)) return 's_method';
  if (/^(фармакология|лекции дмитриенко)/.test(f)) return 's_lect';
  // ключевые слова в названии важнее папки
  if (/эндодон|endodont|перелечив/.test(name)) return 'b_endo';
  if (/пародонт|periodont|зуккелли|zucchelli|мягких тканей|мягкий тканей|мягких ткане|цур о /.test(name)) return 'b_perio';
  if (/слизист|сопр/.test(name)) return 'b_oralmed';
  if (/антибиот/.test(name)) return 'b_pharm';
  if (/юридич|право/.test(name)) return 'b_law';
  if (/неотложн/.test(name)) return 'b_anest';
  const map = [[/анатомия/, 'b_anat'], [/анестезиолог/, 'b_anest'], [/детская/, 'b_kids'], [/материаловед/, 'b_mat'], [/медицинское право/, 'b_law'],
    [/моделирование/, 'b_model'], [/неврология/, 'b_neuro'], [/ортодонт/, 'b_ortho'], [/ортопедическ/, 'b_prosth'], [/профилактическ/, 'b_prev'],
    [/рентгенолог/, 'b_rad'], [/терапевтическ/, 'b_resto'], [/члх/, 'b_omfs'], [/хирургическ/, 'b_surg']];
  for (const [re, id] of map) if (re.test(f)) return id;
  if (/моляр|удален|имплант/.test(name)) return 'b_surg';
  if (/жевательный орган|славичек|окклюз/.test(name)) return 'b_prosth';
  if (/восков|кано/.test(name)) return 'b_model';
  return 'b_resto';
}
function docTitle(path){
  let n = path.split('/').pop().replace(/\.(pdf|djvu|docx?|pptx?|txt|jpe?g|png|zip|rtf|epub|xlsx?)$/i, '');
  n = n.replace(/-\d{8}T\d{6}Z-\d{3}$/, m => ' · часть ' + parseInt(m.slice(-3))).replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim();
  return n;
}

async function openReader(d, url){

}
function closeReader(silent){
  if (!RD.doc) { $('#reader').classList.remove('on'); return; }
  if (RD.io) RD.io.disconnect();
  try { RD.pdf && RD.pdf.destroy(); } catch(e){}
  RD.pdf = null; RD.doc = null; $('#rdPages').innerHTML = ''; $('#reader').classList.remove('on'); hideRdPop();

}
function buildPages(){
  const host = $('#rdPages'); host.innerHTML = ''; RD.pages = []; RD.rendered = new Set();
  if (RD.io) RD.io.disconnect();
  RD.io = new IntersectionObserver(ents => { for (const e of ents) if (e.isIntersecting) renderPage(+e.target.dataset.p); }, {root: $('#rdScroll'), rootMargin: '900px 0px'});
  for (let i = 1; i <= RD.pdf.numPages; i++){
    const el = document.createElement('div'); el.className = 'pg'; el.dataset.p = i;
    el.style.width = RD.base.w * RD.scale + 'px'; el.style.height = RD.base.h * RD.scale + 'px';
    el.innerHTML = `<canvas class="pgc"></canvas><div class="hl-layer"></div><div class="textLayer"></div><canvas class="ink"></canvas><div class="nt-layer"></div><div class="pgn">${i}</div>`;
    host.appendChild(el); RD.pages.push(el); RD.io.observe(el);
  }
  $('#rdZoom').textContent = Math.round(RD.scale * 100) + '%';
}
async function renderPage(n){
  if (RD.rendered.has(n) || !RD.pdf) return; RD.rendered.add(n);
  const el = RD.pages[n-1]; const scale = RD.scale; const pdf = RD.pdf;
  try {
    const page = await pdf.getPage(n); if (pdf !== RD.pdf || scale !== RD.scale) return;
    const vp = page.getViewport({scale});
    el.style.width = vp.width + 'px'; el.style.height = vp.height + 'px';
    const dpr = window.devicePixelRatio || 1;
    const c = el.querySelector('.pgc'); c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr); c.style.width = vp.width + 'px'; c.style.height = vp.height + 'px';
    await page.render({canvasContext: c.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr,0,0,dpr,0,0] : null}).promise;
    const tl = el.querySelector('.textLayer'); tl.innerHTML = ''; tl.style.setProperty('--scale-factor', scale);
    const tc = await page.getTextContent();
    pdfjsLib.renderTextLayer({textContentSource: tc, container: tl, viewport: vp, textDivs: []});
    const ink = el.querySelector('.ink'); ink.width = Math.floor(vp.width * dpr); ink.height = Math.floor(vp.height * dpr); ink.style.width = vp.width + 'px'; ink.style.height = vp.height + 'px';
    drawAnns(n);
    trimRendered(n);
  } catch(e){ RD.rendered.delete(n); }
}
function trimRendered(cur){
  if (RD.rendered.size <= 14) return;
  for (const n of [...RD.rendered].sort((a,b) => Math.abs(b-cur) - Math.abs(a-cur))){
    if (RD.rendered.size <= 10) break;
    if (Math.abs(n - cur) < 4) continue;
    const el = RD.pages[n-1]; const c = el.querySelector('.pgc'); c.width = c.height = 0; el.querySelector('.textLayer').innerHTML = '';
    RD.rendered.delete(n);
  }
}
function setZoom(s){
  const keep = curPage();
  RD.scale = Math.min(4, Math.max(.4, Math.round(s * 100) / 100)); S.readerScale = RD.scale; save();
  buildPages(); scrollToPage(keep, false);
}
function curPage(){

// ---- отрисовка пометок ----
function drawAnns(n){
  const el = RD.pages[n-1]; if (!el || !RD.doc) return;
  const W = el.offsetWidth, H = el.offsetHeight;
  const list = annOf(RD.doc.id).filter(a => a.p === n);
  el.querySelector('.hl-layer').innerHTML = list.filter(a => a.t === 'hl').map(a => a.r.map(([x,y,w,h]) =>
    `<div class="hl" data-a="${a.id}" style="left:${x*W}px;top:${y*H}px;width:${w*W}px;height:${h*H}px;background:${a.c}" title="${esc(a.cm||'')}"></div>`).join('')).join('');
  el.querySelector('.nt-layer').innerHTML = list.filter(a => a.t === 'note' || a.t === 'text' || (a.t === 'hl' && a.cm)).map(a => {
    if (a.t === 'note') return `<div class="nt" data-a="${a.id}" style="left:${a.x*W}px;top:${a.y*H}px;background:${a.c}" title="${esc(a.tx)}">📝</div>`;
    if (a.t === 'text') return `<div class="tx" data-a="${a.id}" style="left:${a.x*W}px;top:${a.y*H}px;color:${a.c};font-size:${(a.fs||0.018)*W}px">${esc(a.tx)}</div>`;
    const [x,y,w] = a.r[a.r.length-1]; return `<div class="nt sm" data-a="${a.id}" style="left:${(x+w)*W}px;top:${y*H - 8}px;background:${a.c}" title="${esc(a.cm)}">💬</div>`;
  }).join('');
  const ink = el.querySelector('.ink'); const ctx = ink.getContext('2d'); const dpr = ink.width / (W || 1);
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0, 0, ink.width, ink.height); ctx.setTransform(dpr,0,0,dpr,0,0);
  for (const a of list.filter(a => a.t === 'ink')) strokePath(ctx, a, W, H);
}
function strokePath(ctx, a, W, H){
  ctx.strokeStyle = a.c; ctx.lineWidth = a.w * W; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = a.hi ? .35 : 1;
  ctx.beginPath(); for (let i = 0; i < a.pts.length; i += 2){ const x = a.pts[i]*W, y = a.pts[i+1]*H; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); ctx.globalAlpha = 1;
}
function redraw(n){ if (n) drawAnns(n); else RD.rendered.forEach(drawAnns); renderRdSide(); }

// ---- операции с пометками ----
function addAnn(a){ a.id = a.id || uid(); a.at = Date.now(); annOf(RD.doc.id).push(a); RD.undo.push({op:'add', a}); annTouch(); redraw(a.p); return a; }
function delAnn(id){ const L = annOf(RD.doc.id); const i = L.findIndex(x => x.id === id); if (i < 0) return; const [a] = L.splice(i, 1); RD.undo.push({op:'del', a}); annTouch(); redraw(a.p); hideRdPop(); }
function undoAnn(){
  const u = RD.undo.pop(); if (!u) return toast('Нечего отменять');
  const L = annOf(RD.doc.id);
  if (u.op === 'add'){ const i = L.findIndex(x => x.id === u.a.id); if (i >= 0) L.splice(i, 1); }
  else if (u.op === 'del') L.push(u.a);
  else if (u.op === 'edit'){ const x = L.find(x => x.id === u.a.id); if (x) Object.assign(x, u.prev); }
  annTouch(); redraw(u.a.p);
}
function editAnn(a, patch){ RD.undo.push({op:'edit', a, prev: Object.fromEntries(Object.keys(patch).map(k => [k, a[k]]))}); Object.assign(a, patch); a.at = Date.now(); annTouch(); redraw(a.p); }

function pageOf(clientX, clientY){
  for (const el of RD.pages){ const r = el.getBoundingClientRect(); if (clientY >= r.top && clientY <= r.bottom && clientX >= r.left - 40 && clientX <= r.right + 40) return el; }
  return null;
}
// выделение текста → хайлайт
function selectionToHl(color){
  const sel = window.getSelection(); if (!sel || sel.isCollapsed || !sel.rangeCount) return false;
  const range = sel.getRangeAt(0); const rects = [...range.getClientRects()].filter(r => r.width > 1 && r.height > 1);
  if (!rects.length) return false;
  const byPage = new Map();
  for (const r of rects){
    const el = pageOf(r.left + r.width/2, r.top + r.height/2); if (!el) continue;
    const pr = el.getBoundingClientRect();
    const arr = byPage.get(el) || []; arr.push([(r.left-pr.left)/pr.width, (r.top-pr.top)/pr.height, r.width/pr.width, r.height/pr.height]); byPage.set(el, arr);
  }
  const text = sel.toString().replace(/\s+/g, ' ').trim();
  let last = null;
  for (const [el, arr] of byPage){
    // склеиваем фрагменты одной строки
    arr.sort((a,b) => a[1]-b[1] || a[0]-b[0]); const m = [];
    for (const r of arr){ const p = m[m.length-1]; if (p && Math.abs(p[1]-r[1]) < p[3]*.5 && r[0] <= p[0]+p[2]+.01){ const x2 = Math.max(p[0]+p[2], r[0]+r[2]); p[2] = x2 - p[0]; p[3] = Math.max(p[3], r[3]); } else m.push([...r]); }
    last = addAnn({t:'hl', p:+el.dataset.p, c:color, r:m.map(x => x.map(r4)), tx:text.slice(0, 500)});
  }
  sel.removeAllRanges(); return last;

function hitInk(n, x, y){
  const el = RD.pages[n-1]; const W = el.offsetWidth, H = el.offsetHeight;

  const rows = await sb(`/rest/v1/user_state?select=state,updated_at&user_id=eq.${ACC.session.user.id}`);
  return rows && rows[0] ? rows[0].state : null;
}
function scheduleSync(){
  if (ACC.mode !== 'user' || !ACC.session) return;
  if (ACC.status !== 'syncing' && ACC.status !== 'offline' && ACC.status !== 'relogin'){ ACC.status = 'dirty'; renderUserChip(); }
  if (!ACC.timer) ACC.timer = setTimeout(() => { ACC.timer = null; syncNow(); }, 12000);
}
function syncNow(force){
  if (ACC.mode !== 'user' || !ACC.session || !serverReady()) return Promise.resolve();
  if (ACC.inflight){ ACC.again = true; return ACC.inflight; }
  // синхронизация привязана к конкретному пользователю и входу: если за время запроса
  // пользователь вышел или сменился — результат выбрасывается и чужие данные не попадут в сеанс
  const gen = ACC.gen, uid = ACC.session.user.id, key = stateKey();
  const alive = () => gen === ACC.gen && ACC.session && ACC.session.user.id === uid;
  ACC.status = 'syncing'; renderUserChip();
  ACC.inflight = (async () => {
    try {
      const rows = await sb(`/rest/v1/user_state?select=state,updated_at&user_id=eq.${uid}`);
      if (!alive()) return;
      const remote = rows && rows[0] ? rows[0].state : null;
      if (remote){
        const before = JSON.stringify(S);
        const merged = mergeState(S, remote);
        if (JSON.stringify(merged) !== before){
          S = merged; lsSet(key, S);
          if (!cur && !RD.doc && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { buildAll(); render(); }
        }
      }
      const snapshot = S;
      await sb('/rest/v1/user_state', {method: 'POST', headers: {Prefer: 'resolution=merge-duplicates,return=minimal'},
        body: {user_id: uid, state: snapshot, updated_at: new Date().toISOString()}});
      if (!alive()) return;
      ACC.status = 'ok'; ACC.lastSync = Date.now(); ACC.err = '';
    } catch(e){
      if (!alive()) return;
      ACC.err = ruErr(e);
      ACC.status = ACC.status === 'relogin' ? 'relogin' : (/связи|fetch|network/i.test(ACC.err) ? 'offline' : 'error');
      if (force) throw e;
    }
  })().finally(() => {
    ACC.inflight = null; renderUserChip();
    if (ACC.again){ ACC.again = false; if (alive()) setTimeout(syncNow, 1500); }
  });
  return ACC.inflight;
}
// слияние двух копий данных (этот ПК и облако)
function mergeState(a, b){
  a = Object.assign({}, DEF_STATE, a); b = Object.assign({}, DEF_STATE, b);
  const [old, neu] = (a._mod || 0) >= (b._mod || 0) ? [b, a] : [a, b];
  const out = Object.assign({}, old, neu);
  const byTime = (x, y, f) => { const r = Object.assign({}, x); for (const k in y) if (!r[k] || f(y[k]) > f(r[k])) r[k] = y[k]; return r; };
  out.prog = byTime(old.prog, neu.prog, p => (p && p.last) || 0);
  out.books = byTime(old.books, neu.books, p => (p && p.at) || 0);
  out.daily = Object.assign({}, old.daily); for (const k in neu.daily) out.daily[k] = Math.max(out.daily[k] || 0, neu.daily[k]);
  out.notesT = Object.assign({}, old.notesT, neu.notesT); out.notes = {};
  for (const k of new Set([...Object.keys(old.notes || {}), ...Object.keys(neu.notes || {}), ...Object.keys(out.notesT)])){
    const ta = (old.notesT || {})[k] || 0, tb = (neu.notesT || {})[k] || 0;
    const v = tb >= ta ? (neu.notes || {})[k] : (old.notes || {})[k];
    out.notesT[k] = Math.max(ta, tb); if (v && v.trim()) out.notes[k] = v;
  }
  out.ann = Object.assign({}, old.ann); for (const k in neu.ann) if (!out.ann[k] || (neu.ann[k].mod || 0) >= (out.ann[k].mod || 0)) out.ann[k] = neu.ann[k];
  out.delCards = Object.assign({}, old.delCards, neu.delCards);
  const cards = new Map();
  for (const c of [...(old.cards || []), ...(neu.cards || [])]){ const p = cards.get(c.id); if (!p || (c.upd || c.created || 0) >= (p.upd || p.created || 0)) cards.set(c.id, c); }
  out.cards = [...cards.values()].filter(c => !out.delCards[c.id]).sort((x, y) => (x.created || 0) - (y.created || 0));
  out._mod = Math.max(a._mod || 0, b._mod || 0);
  return out;
}

function applyCode(code){

}

function plural(n, a, b, c){ const m = n % 10, h = n % 100; return n + ' ' + (m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c); }

function cleanTitle(path){
  const parts = path.split('/').filter(Boolean);
  let n = parts[parts.length-1].replace(/(\.(mp4|mov|mkv|wmv|avi|m4v|webm))+$/ig, '');
  n = n.replace(/\[[^\]]{6,}\]/g, '').replace(/—\s*Профиль.*$/,'').replace(/\s*и еще \d+ страниц\S*/,'').replace(/_DT$/,'').replace(/[_+]/g,' ').replace(/\s+/g,' ').trim();
  const parent = (parts[parts.length-2] || '').replace(/[-–—\s]+$/,'');
  const letters = (n.match(/[a-zа-яё]/ig) || []).length;
  if (letters < 6 || /^\d[\d\s.:,-]*$/.test(n)) n = parent + ' — ' + n;
  return n;
}
function seriesOf(path){
  const parts = path.split('/').filter(Boolean);
  const f = parts.slice(0,-1).filter(x => !ROOTS.test(x.toLowerCase()));
  return f.length ? f.slice(-2).join(' › ').replace(/[-–\s]+(?= ›|$)/g,'') : '';
}

// ===== Сканирование Диска =====
async function apiList(path, offset){
  const u = `${API}?public_key=${encodeURIComponent(PUBLIC_KEY)}&path=${encodeURIComponent(path)}&limit=1000&offset=${offset}&fields=_embedded.items.path,_embedded.items.type,_embedded.items.size,_embedded.items.media_type,_embedded.total`;
  for (let i = 0; i < 4; i++){
    try { const r = await fetch(u); if (r.ok) return await r.json(); if (r.status === 404) return null; } catch(e){}
    await new Promise(r => setTimeout(r, 800 * (i+1)));
  }
  throw new Error('Нет ответа от Яндекс Диска для ' + path);
}
async function scanDisk(onProgress){
  const files = [], queue = ['/']; let dirs = 0, done = 0, active = 0;
  return new Promise((resolve, reject) => {
    const pump = () => {
      if (!queue.length && !active) return resolve(files);
      while (queue.length && active < 6){
        const p = queue.shift(); active++;
        (async () => {
          let off = 0;
          while (true){
            const r = await apiList(p, off); const e = r && r._embedded; if (!e) break;
            for (const it of e.items){
              if (it.type === 'dir'){ queue.push(it.path); dirs++; }
              else files.push([it.path, it.size, it.media_type === 'video' ? 'v' : 'd']);
            }
            off += e.items.length; if (off >= e.total || !e.items.length) break;
          }
        })().catch(reject).finally(() => { active--; done++; onProgress(done, dirs + 1, files.length); pump(); });
      }
    };
    pump();
  });
}
function dedupe(items){
  const by = new Map();
  for (const [path, size] of items){
    const name = path.split('/').pop();
    const k = name.toLowerCase() + '|' + size;
    const prev = by.get(k);
    if (!prev || (path.startsWith(PREFERRED_ROOT) && !prev.path.startsWith(PREFERRED_ROOT))) by.set(k, {path, size});
  }
  return [...by.values()];
}
function buildAll(){
  if (!CAT) { VIDEOS = []; DOCS = []; return; }
  const vids = CAT.items.filter(x => x[2] === 'v' && !x[0].split('/').pop().startsWith('._') && x[1] > 1e6);
  const docs = CAT.items.filter(x => x[2] === 'd' && DOC_EXT.test(x[0]) && !x[0].split('/').pop().startsWith('._') && x[1] > 300);
  VIDEOS = dedupe(vids).map(v => {
    const o = S.ovr[v.path] || {};
    let auto = classify(v.path); if (auto === 'other') auto = classifyArea(v.path);
    const sec = (o.sec === 'other' ? 'misc' : o.sec) || auto;
    return {kind:'v', id:v.path, path:v.path, size:v.size, title:cleanTitle(v.path), series:seriesOf(v.path), sec, lvl: o.lvl || levelOf(v.path, sec), ext:extOf(v.path), att:[]};
  }).sort((a,b) => a.lvl - b.lvl || collator.compare(a.series, b.series) || collator.compare(a.path, b.path));
  DOCS = dedupe(docs).map(d => ({kind:'d', id:d.path, path:d.path, size:d.size, title:docTitle(d.path), ext:extOf(d.path), cat:libCategory(d.path), folder:seriesOf(d.path)}))
    .sort((a,b) => collator.compare(a.title, b.title));
  // материалы к вебинарам: файл из папки видео (или её подпапки «Доп», «Новая папка»…) прикрепляется ко всем видео этой папки
  const byDir = new Map(); VIDEOS.forEach(v => { const d = dirOf(v.path); if (!byDir.has(d)) byDir.set(d, []); byDir.get(d).push(v); });
  for (const d of DOCS){
    if (d.cat !== 's_course') continue;
    let dir = dirOf(d.path);
    for (let up = 0; up < 3 && dir; up++){
      const vs = byDir.get(dir);
      if (vs){ vs.forEach(v => v.att.push(d)); d.videos = vs; break; }
      dir = dirOf(dir);
    }
  }
  BYID = new Map([...VIDEOS, ...DOCS].map(x => [x.id, x]));
}

function listByLevel(list, grouped=true, showSec=false){
  if (!list.length) return `<div class="empty">Здесь пока пусто</div>`;
  let h = '';
  for (const L of [1,2,3]){
    const arr = list.filter(v => v.lvl === L); if (!arr.length) continue;
    h += `<div class="lvl-h"><span class="chip lv${L}">${LEVELS[L]}</span><span class="muted">${arr.length}</span><span class="bar"></span></div>`;
    let lastS = null;
    for (const v of arr){ if (grouped && v.series !== lastS){ lastS = v.series; if (v.series) h += `<div class="ser">📁 ${esc(v.series)}</div>`; } h += vidRow(v, showSec); }
  }
  return h;
}

function streak(){
  let n = 0; const d = new Date();
  if ((S.daily[dayKey(d)] || 0) < 300) d.setDate(d.getDate() - 1);
  while ((S.daily[dayKey(d)] || 0) >= 300){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
function statsWidget(){
  const today = S.daily[dayKey()] || 0, goal = S.goal * 60;
  const total = Object.values(S.daily).reduce((a,b)=>a+b, 0);
  const days = []; for (let i = 13; i >= 0; i--){ const d = new Date(); d.setDate(d.getDate()-i); days.push([dayKey(d), S.daily[dayKey(d)]||0, i===0]); }
  const mx = Math.max(goal, ...days.map(x=>x[1])) || 1;
  const doneCnt = VIDEOS.filter(isDone).length, readCnt = Object.values(S.books).filter(b=>b.st==='done').length;
  return `<div class="stats">
    <div class="card"><div class="muted">Сегодня</div><div class="stat">${fmtMin(today)} <span class="muted" style="font-size:14px;font-weight:400">из ${S.goal} мин</span></div><div class="pbar" style="max-width:none;height:6px"><i style="width:${Math.min(100,today/goal*100)}%;${today>=goal?'background:var(--good)':''}"></i></div>${today>=goal?'<div style="color:var(--good);font-size:12px;margin-top:6px">Цель дня выполнена 🎉</div>':''}</div>
    <div class="card"><div class="muted">Серия</div><div class="stat">🔥 ${streak()}</div><div class="muted" style="font-size:12px">дней подряд (от 5 мин)</div></div>
    <div class="card"><div class="muted">Всего</div><div class="stat">${fmtMin(total)}</div><div class="muted" style="font-size:12px">${plural(doneCnt,'видео','видео','видео')} просмотрено · ${plural(readCnt,'книга','книги','книг')} прочитано</div></div>
    <div class="card"><div class="muted">Последние 14 дней</div><div class="bars">${days.map(([k,s,t]) => `<i class="${t?'today':''} ${s>=goal?'goal':''}" style="height:${Math.max(3, s/mx*100)}%" title="${k}: ${fmtMin(s)}"></i>`).join('')}</div></div>
  </div>`;
}

function download(text, name, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: type + ';charset=utf-8'})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }

const BOOK_CACHE = 'sva-books';
const bookKey = p => 'https://sva.local/book?' + encodeURIComponent(p);
async function openDocWeb(d){
  if (d.ext !== 'pdf' || typeof pdfjsLib === 'undefined'){ window.open(diskViewUrl(d.path), '_blank'); return; }
  try {
    const cache = ('caches' in window) ? await caches.open(BOOK_CACHE) : null;
    const hit = cache && await cache.match(bookKey(d.path));
    let url;
    if (hit) url = URL.createObjectURL(await hit.blob());
    else {
      url = await getHref(d.path, true);
      // небольшие книги сохраняем на устройстве, чтобы читать без интернета
      if (cache && d.size < 150e6) fetch(url).then(r => r.ok && cache.put(bookKey(d.path), r)).then(() => { const L = lsGet('sva.webBooks', []); if (!L.includes(d.path)) { L.push(d.path); lsSet('sva.webBooks', L); } }).catch(() => {});
    }
    if (cur) closePlayer();
    openReader(d, url);
  } catch(e){ toast('Не удалось открыть книгу: ' + e.message); }
}
async function openDoc(d){
  if (!d) return;
  if (!DESK) return openDocWeb(d);
  if (d.ext === 'zip' && !confirm(`Скачать архив «${d.title}» (${fmtSize(d.size)})? Он сохранится в папку программы, затем откроется в проводнике.`)) return;
  try {
    const cached = await DESK.isCached(d.path, d.size);
    const href = cached ? '' : await getHref(d.path, true);
    $('#dlName').textContent = d.title; $('#dlPct').textContent = ''; $('#dlBar').style.width = '0%';
    if (!cached) $('#dl').classList.add('on');
    const r = await DESK.openDoc({url: href, key: d.path, name: d.path.split('/').pop(), size: d.size, title: d.title});
    $('#dl').classList.remove('on');
    if (r.ok && r.pdfUrl){ if (cur) closePlayer(); openReader(d, r.pdfUrl); return; }
    if (!r.ok){ toast('Нет программы для .' + d.ext + ' — открываю на Яндекс Диске'); window.open(diskViewUrl(d.path), '_blank'); }
    else if (d.ext !== 'pdf') toast('Открыто в программе Windows по умолчанию');
    if (d.ext !== 'zip' && !S.books[d.id]?.st){ (S.books[d.id] = S.books[d.id] || {}).st = 'reading'; save(); }
  } catch(e){ $('#dl').classList.remove('on'); toast('Не удалось открыть: ' + e.message); }
}
if (DESK) DESK.onProgress((key, got, total) => { $('#dlPct').textContent = total ? Math.round(got/total*100) + '% · ' + fmtSize(got) : fmtSize(got); $('#dlBar').style.width = total ? (got/total*100)+'%' : '50%'; });

function scanScreen(){
  setTimeout(() => { const b = $('#scanBtn'); if (b) b.onclick = runScan; }, 0);
  const upd = !!localStorage.getItem('sva.catalog.v1');
  return `<div class="scan"><div style="font-size:46px">🦷</div><h1>${upd?'Обновление каталога':'Добро пожаловать'}</h1>
    <div class="sub">${upd?'Появились библиотека книг, материалы к вебинарам и все направления стоматологии. Нужно один раз перечитать папку на Диске — ваш прогресс, карточки и избранное сохранятся.':'Приложение прочитает вашу папку на Яндекс Диске: разложит видео по разделам и уровням, соберёт библиотеку книг и материалы к вебинарам. Видео не скачиваются — они воспроизводятся прямо с Диска.'}</div>
    <div class="prog"><i id="scanBar" style="width:0%"></i></div><div class="muted" id="scanTxt">Займёт около минуты</div>
    <div style="margin-top:16px"><button class="btn pri" id="scanBtn">${upd?'Обновить каталог':'Загрузить каталог'}</button></div></div>`;
}
async function runScan(){
  const b = $('#scanBtn'); if (b) b.disabled = true;
  const bar = $('#scanBar'), txt = $('#scanTxt');
  try {
    const files = await scanDisk((d, t, n) => { if (bar) bar.style.width = Math.min(98, d/t*100) + '%'; if (txt) txt.textContent = `Папок: ${d} из ${t} · файлов: ${n}`; });
    CAT = {at: Date.now(), items: files}; lsSet(LS_CAT, CAT); try { localStorage.removeItem('sva.catalog.v1'); } catch(e){}
    buildAll(); toast(`Готово: ${VIDEOS.length} видео, ${DOCS.length} документов`); go({view:'home'});
  } catch(e){
    if (txt) txt.innerHTML = 'Ошибка: ' + esc(e.message) + '<br>Проверьте интернет и попробуйте ещё раз.';
    if (b) b.disabled = false; else toast('Ошибка обновления: ' + e.message);
  }
}

// ===== Плеер =====
const video = $('#video');
let cur = null, lastSave = 0, lastTick = 0, hrefCache = {}, nextTimer = null;
async function getHref(path, fresh){
  const c = hrefCache[path]; if (!fresh && c && Date.now() - c.at < 30*60*1000) return c.href;
  const r = await fetch(`${API}/download?public_key=${encodeURIComponent(PUBLIC_KEY)}&path=${encodeURIComponent(path)}`);
  if (!r.ok) throw new Error('Диск вернул ' + r.status);
  const j = await r.json(); hrefCache[path] = {href:j.href, at:Date.now()}; return j.href;
}
const diskViewUrl = path => PUBLIC_KEY + path.split('/').map(encodeURIComponent).join('/');
function showMsg(html){ $('#vmsgBox').innerHTML = html; $('#vmsg').classList.add('on'); }
function hideMsg(){ $('#vmsg').classList.remove('on'); }
const nextOf = v => { const list = VIDEOS.filter(x => x.sec === v.sec); const i = list.indexOf(v); return i >= 0 ? list[i+1] : null; };

let pTab = 'att';
function setPTab(t){ pTab = t; document.querySelectorAll('.ptab').forEach(b => b.classList.toggle('on', b.dataset.p === t)); document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + t)); }
document.querySelectorAll('.ptab').forEach(b => b.onclick = () => setPTab(b.dataset.p));

async function openPlayer(id, atTime){
  const v = BYID.get(id); if (!v || v.kind !== 'v') return;
  if (cur) storeProgress();
  clearTimeout(nextTimer);
  cur = v; $('#player').classList.add('on');
  $('#plTitle').textContent = v.title; $('#plStar').classList.toggle('on', !!S.fav[v.id]); $('#plLater').classList.toggle('on', !!S.later[v.id]);
  const opt = s => `<option value="${s.id}" ${s.id===v.sec?'selected':''}>${s.icon} ${esc(s.name)}</option>`;
  $('#plSec').innerHTML = `<optgroup label="Хирургия">${SECTIONS.map(opt).join('')}</optgroup><optgroup label="Другие направления">${AREAS.map(opt).join('')}</optgroup>`;
  $('#plLvl').value = v.lvl;
  $('#nextBtn').style.display = nextOf(v) ? '' : 'none';
  renderAtt(); renderNote(); renderPlCards(); renderSpeeds();
  setPTab(v.att.length ? 'att' : (S.notes[v.id]?.trim() ? 'note' : 'note'));
  video.pause(); video.removeAttribute('src'); video.load();
  showMsg('Загрузка…');
  cur._seek = atTime;
  try {
    const href = await getHref(v.path);
    if (cur !== v) return;
    video.defaultPlaybackRate = S.speed; video.src = href; video.playbackRate = S.speed; video.play().catch(()=>{});
  } catch(e){ showMsg(`Не удалось получить ссылку на видео: ${esc(e.message)}<br><br><button class="btn" onclick="openPlayer(cur.id)">Повторить</button>`); }
}
function renderAtt(){
  $('#attN').textContent = cur.att.length ? '(' + cur.att.length + ')' : '';
  const sib = VIDEOS.filter(x => x !== cur && x.series === cur.series && x.series).slice(0, 30);
  $('#p-att').innerHTML = (cur.att.length ? cur.att.map(d => `<div class="att" data-doc="${esc(d.id)}"><div class="fi ${d.ext}">${esc(d.ext.toUpperCase())}</div><div style="min-width:0"><div style="font-size:13px">${esc(d.title)}</div><div class="muted" style="font-size:11px">${fmtSize(d.size)}</div></div></div>`).join('')
      : '<div class="muted" style="font-size:13px">К этому видео в папке нет дополнительных файлов.</div>')
    + (sib.length ? `<div style="margin-top:16px"><b>В этой серии</b></div>` + sib.map(x => `<div class="att" data-sib="${esc(x.id)}"><div style="width:22px;text-align:center">${isDone(x)?'✓':'▶'}</div><div style="font-size:13px">${esc(x.title)}</div></div>`).join('') : '');
  $('#p-att').querySelectorAll('[data-doc]').forEach(el => el.onclick = () => { video.pause(); openDoc(BYID.get(el.dataset.doc)); });
  $('#p-att').querySelectorAll('[data-sib]').forEach(el => el.onclick = () => openPlayer(el.dataset.sib));
}
function renderNote(){
  $('#noteTa').value = S.notes[cur.id] || '';
  renderMarks();
}
function renderMarks(){
  const t = $('#noteTa').value; const marks = [...t.matchAll(/\[(\d{1,2}:)?\d{1,2}:\d{2}\]/g)].map(m => m[0]);
  $('#noteMarks').innerHTML = [...new Set(marks)].map(m => `<button class="ts" data-mk="${m}">▶ ${m.slice(1,-1)}</button>`).join('');
  $('#noteMarks').querySelectorAll('[data-mk]').forEach(b => b.onclick = () => { const p = b.dataset.mk.slice(1,-1).split(':').map(Number); video.currentTime = p.reduce((a,x) => a*60 + x, 0); video.play(); });
}
$('#noteTa').addEventListener('input', () => { if (!cur) return; S.notes[cur.id] = $('#noteTa').value; S.notesT[cur.id] = Date.now(); if (!S.notes[cur.id].trim()) delete S.notes[cur.id]; save(); clearTimeout(window._mk); window._mk = setTimeout(renderMarks, 400); });
$('#noteTs').onclick = () => { const ta = $('#noteTa'); const s = `[${fmtT(video.currentTime)}] `; const p = ta.selectionStart ?? ta.value.length;
  const pre = ta.value.slice(0, p), ins = (pre && !pre.endsWith('\n') ? '\n' : '') + s; ta.value = pre + ins + ta.value.slice(p); ta.focus(); ta.selectionStart = ta.selectionEnd = p + ins.length; ta.dispatchEvent(new Event('input')); };

video.addEventListener('loadedmetadata', () => {
  hideMsg(); if (!cur) return;
  const p = S.prog[cur.id] || (S.prog[cur.id] = {t:0});
  p.d = video.duration; p.last = Date.now(); save();
  const target = cur._seek != null ? cur._seek : (p.t && p.t < video.duration - 15 ? p.t : 0);
  if (target) { video.currentTime = target; if (cur._seek == null) toast('Продолжаем с ' + fmtT(target)); }
  cur._seek = null; video.playbackRate = S.speed;
});
video.addEventListener('play', () => { lastTick = Date.now(); });
video.addEventListener('timeupdate', () => {
  if (!cur || !video.duration) return;
  $('#cTsVal').textContent = fmtT(video.currentTime);
  const now = Date.now();
  if (!video.paused && lastTick){ const dt = now - lastTick; if (dt > 0 && dt < 5000){ const k = dayKey(); S.daily[k] = (S.daily[k] || 0) + dt/1000; } }
  lastTick = now;
  if (now - lastSave < 3000) return; lastSave = now;
  storeProgress();
});
function storeProgress(){
  if (!cur || !video.duration) return;
  const p = S.prog[cur.id] || (S.prog[cur.id] = {});
  p.t = video.currentTime; p.d = video.duration; p.last = Date.now();
  if (p.t / p.d > 0.92 && !p.done){ p.done = true; delete S.later[cur.id]; }
  save();
}
video.addEventListener('pause', storeProgress);
video.addEventListener('ended', () => {
  if (!cur) return; S.prog[cur.id].done = true; delete S.later[cur.id]; save();
  const n = nextOf(cur);
  if (n && S.autoNext){
    showMsg(`<div style="font-size:13px" class="muted">Далее в разделе</div><div style="font-size:17px;margin:6px 0 14px;color:var(--text)">${esc(n.title)}</div><div class="row" style="justify-content:center"><button class="btn pri" id="goNext">Смотреть сейчас</button><button class="btn" id="stayHere">Остаться</button></div><div class="muted" style="margin-top:10px;font-size:12px">Автоматически через 8 секунд</div>`);
    $('#goNext').onclick = () => openPlayer(n.id); $('#stayHere').onclick = () => { clearTimeout(nextTimer); hideMsg(); };
    nextTimer = setTimeout(() => { if (cur && $('#vmsg').classList.contains('on')) openPlayer(n.id); }, 8000);
  } else toast('Отмечено как просмотренное');
});
video.addEventListener('ratechange', () => { if (!cur || video.readyState < 1) return; if (Math.abs(video.playbackRate - S.speed) > 0.01){ S.speed = video.playbackRate; save(); renderSpeeds(); } });
video.addEventListener('error', async () => {
  if (!cur || !video.getAttribute('src')) return;
  const code = video.error && video.error.code;
  if (code === 4 || code === 3){
    showMsg(`<div style="font-size:34px">🎞️</div><b>Формат .${esc(cur.ext)} не воспроизводится встроенным плеером</b><br><br>
      Откройте видео на Яндекс Диске (там свой плеер) или скачайте и смотрите в VLC.<br><br>
      <div class="row" style="justify-content:center"><a class="btn pri" target="_blank" href="${diskViewUrl(cur.path)}">Открыть на Яндекс Диске</a>
      <a class="btn" target="_blank" href="${esc(hrefCache[cur.path]?.href||'#')}">Скачать</a>
      <button class="btn" onclick="markDone()">✓ Отметить просмотренным</button></div>
      <div class="muted" style="margin-top:12px;font-size:12px">Конспект, материалы и карточки для этого видео работают как обычно.</div>`);
  } else {
    const t = video.currentTime || S.prog[cur.id]?.t || 0;
    try { const href = await getHref(cur.path, true); cur._seek = t; video.src = href; video.play().catch(()=>{}); }
    catch(e){ showMsg('Ошибка сети. Проверьте интернет и нажмите «Повторить».<br><br><button class="btn" onclick="openPlayer(cur.id)">Повторить</button>'); }
  }
});
function closePlayer(){ storeProgress(); clearTimeout(nextTimer); video.pause(); video.removeAttribute('src'); video.load(); if (document.pictureInPictureElement) document.exitPictureInPicture().catch(()=>{}); $('#player').classList.remove('on'); cur = null; render(); }
$('#plClose').onclick = closePlayer;
$('#plStar').onclick = () => cur && toggleFav(cur.id);
$('#plLater').onclick = () => cur && toggleLater(cur.id);
function markDone(){ if (!cur) return; const p = S.prog[cur.id] || (S.prog[cur.id] = {t:0}); p.done = !p.done; p.last = Date.now(); if (p.done) delete S.later[cur.id]; save(); toast(p.done ? 'Отмечено как просмотренное' : 'Отметка снята'); }
$('#markDone').onclick = markDone;
$('#back10').onclick = () => video.currentTime -= 10;
$('#fwd10').onclick = () => video.currentTime += 10;
$('#nextBtn').onclick = () => { const n = cur && nextOf(cur); if (n) openPlayer(n.id); };
$('#pipBtn').onclick = () => { if (document.pictureInPictureElement) document.exitPictureInPicture(); else video.requestPictureInPicture().catch(() => toast('Режим «картинка в картинке» недоступен')); };
function renderSpeeds(){
  $('#spdBtns').innerHTML = SPEEDS.map(s => `<button class="spd ${Math.abs(s-S.speed)<.01?'on':''}" data-s="${s}">${s}×</button>`).join('');
  $('#spdBtns').querySelectorAll('[data-s]').forEach(b => b.onclick = () => setSpeed(+b.dataset.s));
}
function setSpeed(s){ S.speed = Math.min(4, Math.max(.25, Math.round(s*100)/100)); video.defaultPlaybackRate = S.speed; video.playbackRate = S.speed; save(); renderSpeeds(); toast('Скорость ' + S.speed + '×'); }
$('#plSec').onchange = e => { S.ovr[cur.id] = Object.assign(S.ovr[cur.id]||{}, {sec:e.target.value}); save(); cur.sec = e.target.value; toast('Раздел изменён'); };
$('#plLvl').onchange = e => { S.ovr[cur.id] = Object.assign(S.ovr[cur.id]||{}, {lvl:+e.target.value}); save(); cur.lvl = +e.target.value; toast('Уровень изменён'); };

// карточки внутри плеера
function renderPlCards(){
  const list = S.cards.filter(c => c.vid === cur.id);
  $('#plCards').innerHTML = list.length ? list.map(c => `<div class="mcard"><div class="q">${esc(c.q)}</div><div class="a">${esc(c.a)}</div>
    <div class="row" style="margin-top:6px">${c.t!=null?`<button class="ts" data-seek="${c.t}">▶ ${fmtT(c.t)}</button>`:''}<span style="flex:1"></span><button class="btn sm" data-del="${c.id}">Удалить</button></div></div>`).join('')
    : '<div class="muted" style="font-size:13px">Пока нет. Остановите видео на важном моменте и добавьте вопрос — потом повторяйте его в разделе «Повторение карточек».</div>';
  $('#plCards').querySelectorAll('[data-seek]').forEach(b => b.onclick = () => { video.currentTime = +b.dataset.seek; video.play(); });
  $('#plCards').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if (confirm('Удалить карточку?')){ S.delCards[b.dataset.del] = Date.now(); S.cards = S.cards.filter(c => c.id !== b.dataset.del); save(); renderPlCards(); } });
}
function addCard(){
  const q = $('#cQ').value.trim(), a = $('#cA').value.trim(); if (!q){ $('#cQ').focus(); return; }
  S.cards.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), vid:cur.id, sec:cur.sec, q, a,
    t: $('#cTs').checked ? Math.floor(video.currentTime) : null, created:Date.now(), due:0, ivl:0, ease:2.5, reps:0});
  save(); $('#cQ').value = ''; $('#cA').value = ''; renderPlCards(); toast('Карточка добавлена');
}
$('#cAdd').onclick = addCard;
[$('#cQ'), $('#cA')].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) addCard(); }));

// горячие клавиши
document.addEventListener('keydown', e => {
  if ($('#auth').classList.contains('on')) return;
  if (RD.doc){ readerKeys(e); return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing){ e.preventDefault(); $('#q').focus(); return; }
  if (route.view === 'review' && !cur && !typing) return reviewKeys(e);
  if (!cur || typing) return;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'k' || k === 'л'){ e.preventDefault(); video.paused ? video.play() : video.pause(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); video.currentTime -= e.shiftKey ? 60 : 10; }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); video.currentTime += e.shiftKey ? 60 : 10; }
  else if (e.key === ']' || e.key === 'ъ' || e.key === '>'){ setSpeed(S.speed + .25); }
  else if (e.key === '[' || e.key === 'х' || e.key === '<'){ setSpeed(S.speed - .25); }
  else if (k === 'f' || k === 'а'){ document.fullscreenElement ? document.exitFullscreen() : video.requestFullscreen(); }
  else if (k === 'n' || k === 'т'){ e.preventDefault(); video.pause(); setPTab('cards'); $('#cQ').focus(); }
  else if (k === 'm' || k === 'ь'){ e.preventDefault(); setPTab('note'); $('#noteTs').click(); }
  else if (e.key === 'Escape' && !document.fullscreenElement){ closePlayer(); }
});
$('#q').addEventListener('input', () => { clearTimeout(window._qt); window._qt = setTimeout(render, 150); });
window.addEventListener('beforeunload', () => { storeProgress(); lsSet(stateKey(), S); });

// ===== Интервальное повторение (SM-2 упрощённо) =====
let rv = null, rvDeck = 'all', rvEnded = 0;
function deckFilter(deck){ return c => deck === 'all' || c.sec === deck || (deck === 'mine' && !c.starter) || (deck === 'starter' && c.starter); }
function renderReview(V){
  const decks = [['all','Все'],['mine','Мои карточки'],['starter','Стартовая колода'], ...ALL_SECS.filter(s => S.cards.some(c=>c.sec===s.id)).map(s => [s.id, s.icon+' '+s.name])];
  if (!rv){
    const f = deckFilter(rvDeck); const due = S.cards.filter(f).filter(c => (c.due||0) <= Date.now()); const all = S.cards.filter(f);
    V.innerHTML = `<h1>🧠 Повторение карточек</h1><div class="sub">Интервальное повторение: то, что помните хорошо, показывается реже, трудное — чаще.</div>
      <div class="row"><select id="deck" style="width:auto">${decks.map(([k,t]) => `<option value="${k}" ${k===rvDeck?'selected':''}>${esc(t)}</option>`).join('')}</select>
      <span class="muted">к повторению: <b style="color:var(--text)">${due.length}</b> из ${all.length}</span></div>
      <div class="row" style="margin-top:16px"><button class="btn pri" id="rvStart" ${due.length?'':'disabled'}>Начать (${due.length})</button>
      <button class="btn" id="rvCram" ${all.length?'':'disabled'}>Повторить всё подряд</button>
      ${!S.starterAdded ? `<button class="btn" id="addStarter">+ Добавить стартовую колоду (${STARTER_CARDS.length})</button>`:''}</div>
      ${rvEnded ? `<div class="card" style="margin-top:18px">Сессия завершена: ${plural(rvEnded,'карточка','карточки','карточек')}. Отличная работа! 🎉</div>`:''}
      ${!S.cards.length ? `<div class="empty" style="margin-top:20px">Карточек пока нет. Откройте любое видео и добавьте вопрос во вкладке «🧠 Карточки» справа от плеера — или подключите стартовую колоду.</div>`:''}
      ${S.starterAdded ? '' : '<div class="muted" style="margin-top:14px;font-size:12px">Стартовая колода — 22 базовых факта по хирургии (дистанции при имплантации, классификации, PASS и т.д.). Сверяйте с учебниками и лекциями.</div>'}`;
    $('#deck').onchange = e => { rvDeck = e.target.value; rvEnded = 0; render(); };
    $('#rvStart').onclick = () => startReview(rvDeck, false);
    $('#rvCram').onclick = () => startReview(rvDeck, true);
    const st = $('#addStarter'); if (st) st.onclick = addStarter;
    return;
  }
  const c = rv.queue[rv.i]; const v = c.vid && BYID.get(c.vid);
  V.innerHTML = `<div class="row"><button class="btn sm" id="rvStop">← Закончить</button><span class="muted">${rv.i+1} / ${rv.queue.length}${rv.cram?' · без учёта интервалов':''}</span>
    <span style="flex:1"></span><span class="chip">${secById(c.sec).icon} ${esc(secById(c.sec).name)}</span></div>
    <div class="flip"><div class="fc ${rv.flipped?'on':''}" id="fc"><div class="face">${esc(c.q)}<span class="hint">нажмите или <kbd>Пробел</kbd>, чтобы перевернуть</span></div>
    <div class="face back">${esc(c.a || '—')}${v?`<span class="hint">из видео: ${esc(v.title.slice(0,60))}</span>`:''}</div></div></div>
    <div class="rate" style="${rv.flipped?'':'visibility:hidden'}">
      <button class="btn" data-g="1" style="border-color:var(--bad)">Снова<small>1 · сегодня</small></button>
      <button class="btn" data-g="2" style="border-color:var(--warn)">Трудно<small>2 · ${nextLabel(c,2)}</small></button>
      <button class="btn" data-g="3" style="border-color:var(--acc)">Хорошо<small>3 · ${nextLabel(c,3)}</small></button>
      <button class="btn" data-g="4" style="border-color:var(--good)">Легко<small>4 · ${nextLabel(c,4)}</small></button></div>
    ${v && c.t!=null ? `<div style="text-align:center;margin-top:14px"><button class="ts" id="rvWatch">▶ Посмотреть этот момент (${fmtT(c.t)})</button></div>`:''}`;
  $('#fc').onclick = () => { rv.flipped = !rv.flipped; render(); };
  $('#rvStop').onclick = () => { rvEnded = rv.i; rv = null; render(); };
  V.querySelectorAll('[data-g]').forEach(b => b.onclick = () => grade(+b.dataset.g));
  const w = $('#rvWatch'); if (w) w.onclick = () => openPlayer(c.vid, c.t);
}
function sched(c, g){
  let {ivl=0, ease=2.5, reps=0} = c;
  if (g === 1){ reps = 0; ivl = 0; ease = Math.max(1.3, ease - .2); }
  else { if (reps === 0) ivl = g===4 ? 3 : 1; else if (reps === 1) ivl = g===2 ? 3 : g===3 ? 4 : 6; else ivl = Math.round(ivl * (g===2 ? 1.2 : g===3 ? ease : ease*1.3));
    ease = Math.max(1.3, ease + (g===2 ? -.15 : g===4 ? .15 : 0)); reps++; }
  return {ivl, ease, reps, due: g===1 ? Date.now() + 60*1000 : Date.now() + ivl*86400000};
}
function nextLabel(c, g){ const d = sched(c, g).ivl; return d < 1 ? 'сегодня' : d === 1 ? '1 день' : d < 5 ? d+' дня' : d+' дн.'; }
function startReview(deck, cram){
  let q = S.cards.filter(deckFilter(deck)); if (!cram) q = q.filter(c => (c.due||0) <= Date.now());
  q.sort(() => Math.random() - .5); rvEnded = 0; rv = {queue:q, i:0, flipped:false, cram}; render();
}
function grade(g){
  const c = rv.queue[rv.i];
  if (!rv.cram || g > 1) Object.assign(c, sched(c, g), {upd: Date.now()});
  if (g === 1) rv.queue.push(c);
  save(); rv.i++; rv.flipped = false;
  if (rv.i >= rv.queue.length){ rvEnded = rv.queue.length; rv = null; }
  render();
}
function reviewKeys(e){
  if (!rv) return;
  if (e.key === ' '){ e.preventDefault(); rv.flipped = !rv.flipped; render(); }
  else if (rv.flipped && /^[1-4]$/.test(e.key)) grade(+e.key);
}
function addStarter(){
  for (const [sec, q, a] of STARTER_CARDS) S.cards.push({id:'s'+Math.random().toString(36).slice(2,9), vid:null, sec, q, a, t:null, starter:true, created:Date.now(), due:0, ivl:0, ease:2.5, reps:0});
  S.starterAdded = true; save(); toast('Стартовая колода добавлена'); render();
}

function renderAllCards(V){
  const rows = S.cards.slice().sort((a,b) => b.created - a.created).map(c => { const v = c.vid && BYID.get(c.vid);
    return `<tr><td><b>${esc(c.q)}</b><div class="muted" style="white-space:pre-wrap">${esc(c.a)}</div></td>
      <td style="width:230px">${secById(c.sec).icon} ${esc(secById(c.sec).name)}${v?`<div><button class="ts" data-cv="${esc(c.id)}">▶ ${esc(v.title.slice(0,40))}${c.t!=null?' · '+fmtT(c.t):''}</button></div>`:c.starter?'<div class="muted">стартовая колода</div>':''}</td>
      <td style="width:110px" class="muted">${(c.due||0) <= Date.now() ? 'к повторению' : 'через ' + Math.ceil((c.due - Date.now())/86400000) + ' дн.'}</td>
      <td style="width:150px"><button class="btn sm" data-edit="${esc(c.id)}">Изменить</button> <button class="btn sm" data-rm="${esc(c.id)}">✕</button></td></tr>`; }).join('');
  V.innerHTML = `<h1>🗂️ Все карточки</h1><div class="sub">${plural(S.cards.length,'карточка','карточки','карточек')}</div>
    ${S.cards.length ? `<table><tr><th>Вопрос / ответ</th><th>Раздел / видео</th><th>Повтор</th><th></th></tr>${rows}</table>` : '<div class="empty">Карточек пока нет</div>'}`;
  V.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if (confirm('Удалить карточку?')){ S.delCards[b.dataset.rm] = Date.now(); S.cards = S.cards.filter(c => c.id !== b.dataset.rm); save(); render(); } });
  V.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const c = S.cards.find(x => x.id === b.dataset.edit); const td = b.closest('tr').firstElementChild;
    td.innerHTML = `<textarea class="eq">${esc(c.q)}</textarea><textarea class="ea" style="margin-top:6px">${esc(c.a)}</textarea><div class="row" style="margin-top:6px"><button class="btn pri sm es">Сохранить</button><button class="btn sm ec">Отмена</button></div>`;
    td.querySelector('.es').onclick = () => { c.q = td.querySelector('.eq').value.trim() || c.q; c.a = td.querySelector('.ea').value.trim(); c.upd = Date.now(); save(); render(); };
    td.querySelector('.ec').onclick = render; });
  V.querySelectorAll('[data-cv]').forEach(b => b.onclick = () => { const c = S.cards.find(x => x.id === b.dataset.cv); openPlayer(c.vid, c.t); });
}

async function renderSettings(V){
  const d = CAT ? new Date(CAT.at).toLocaleString('ru') : '—';
  V.innerHTML = `<h1>⚙️ Данные и настройки</h1><div class="sub">${ACC.mode === 'user' ? 'Ваши данные сохраняются на этом устройстве и синхронизируются с аккаунтом.' : 'Прогресс, конспекты, избранное и карточки хранятся на этом устройстве.'}</div>
    <div class="grid">
      <div class="card"><h3>Обновить каталог</h3><div class="muted">Если на Диске появились новые видео или книги. Последнее обновление: ${d}</div><div class="prog"><i id="scanBar" style="width:0%"></i></div><div class="muted" id="scanTxt"></div><button class="btn pri" id="scanBtn">Обновить</button></div>
      <div class="card"><h3>Цель на день</h3><div class="muted">Минут учёбы в день (видео)</div><div class="row" style="margin-top:10px;flex-wrap:nowrap"><input type="number" id="goal" min="5" max="600" step="5" value="${S.goal}" style="width:100px"><span class="muted">мин</span></div>
        <label class="muted" style="display:flex;gap:8px;margin-top:14px"><input type="checkbox" id="autoNext" ${S.autoNext?'checked':''}> Автоматически включать следующее видео раздела</label></div>
      <div class="card"><h3>Резервная копия</h3><div class="muted">Файл с прогрессом, конспектами, избранным и карточками — можно загрузить на другом устройстве.</div><div class="row" style="margin-top:12px"><button class="btn pri" id="exp">Сохранить копию</button><button class="btn" id="imp">Загрузить копию</button></div></div>
      ${!DESK ? `<div class="card"><h3>Книги на устройстве</h3><div class="muted" id="webStore">Считаю…</div><button class="btn" id="webClear" style="margin-top:12px">Удалить сохранённые книги</button></div>` : ''}
      ${DESK ? `<div class="card"><h3>Скачанные книги</h3><div class="muted" id="cacheInfo">Считаю…</div><div class="row" style="margin-top:12px"><button class="btn" id="cacheOpen">Открыть папку</button><button class="btn" id="cacheClear">Очистить</button></div></div>` : ''}
      ${isMobile() ? '' : `<div class="card"><h3>Горячие клавиши</h3><div class="muted" style="line-height:1.9"><kbd>Пробел</kbd> пауза · <kbd>←</kbd>/<kbd>→</kbd> ±10 с · <kbd>Shift</kbd>+стрелки ±60 с<br><kbd>[</kbd>/<kbd>]</kbd> скорость · <kbd>F</kbd> полный экран<br><kbd>N</kbd> карточка · <kbd>M</kbd> метка времени в конспект<br><kbd>/</kbd> поиск · <kbd>Esc</kbd> закрыть видео${DESK?' · <kbd>F11</kbd> окно на весь экран':''}</div></div>`}
      <div class="card"><h3>Ручные правки разделов</h3><div class="muted">Вы переложили видео: ${Object.keys(S.ovr).length}</div><button class="btn" id="rstOvr" style="margin-top:12px">Сбросить правки</button></div>
      ${accountCard()}
      ${serverCard()}
    </div>`;
  bindAccountSettings();
  $('#scanBtn').onclick = runScan;
  $('#goal').onchange = e => { S.goal = Math.max(5, Math.min(600, +e.target.value || 30)); save(); toast('Цель: ' + S.goal + ' мин в день'); };
  $('#autoNext').onchange = e => { S.autoNext = e.target.checked; save(); };
  $('#exp').onclick = () => download(JSON.stringify(S, null, 1), 'видеотека-копия-' + dayKey() + '.json', 'application/json');
  $('#imp').onclick = () => $('#importFile').click();
  $('#rstOvr').onclick = () => { if (confirm('Вернуть автоматическое распределение для всех видео?')){ S.ovr = {}; save(); buildAll(); render(); } };
  if (!DESK){
    const L = lsGet('sva.webBooks', []); let used = '';
    try { const e = await navigator.storage.estimate(); used = ' · занято ' + fmtSize(e.usage || 0); } catch(e){}
    const el = $('#webStore'); if (el) el.textContent = (L.length ? plural(L.length,'книга','книги','книг') + ' — открываются без интернета' : 'Книги до 150 МБ сохраняются сами после первого открытия') + used;
    const b = $('#webClear'); if (b) b.onclick = async () => { if (!confirm('Удалить сохранённые книги с устройства? На Диске они останутся.')) return; try { await caches.delete(BOOK_CACHE); } catch(e){} lsSet('sva.webBooks', []); render(); };
  }
  if (DESK){
    const info = await DESK.cacheInfo(); const ci = $('#cacheInfo'); if (ci) ci.textContent = info.files ? `${plural(info.files,'файл','файла','файлов')} · ${fmtSize(info.bytes)} — открываются без интернета` : 'Пока ничего не скачано';
    $('#cacheOpen').onclick = () => DESK.openCacheFolder();
    $('#cacheClear').onclick = async () => { if (confirm('Удалить скачанные книги с компьютера? На Диске они останутся.')){ await DESK.clearCache(); render(); } };
  }
}
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d || typeof d !== 'object' || !('prog' in d)) throw new Error('не тот файл');
    if (!confirm('Заменить текущие данные данными из копии?')) return; S = Object.assign({}, DEF_STATE, d); S._mod = Date.now(); lsSet(stateKey(), S); scheduleSync(); buildAll(); toast('Копия загружена'); render();
  } catch(err){ toast('Не удалось прочитать файл: ' + err.message); }
  e.target.value = '';
};

// ===== Старт =====
if (typeof pdfjsLib !== 'undefined') pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
$('#rdExport').onclick = exportAnns;
rdInit(); buildAll(); render(); renderUserChip();
if (!DESK && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (!DESK && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if (!ACC.mode) showAuth();
else if (ACC.mode === 'user' && ACC.session) syncNow();
</script>
